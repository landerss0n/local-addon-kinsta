name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Build BEFORE Test: bundle.packaging.test.ts inspects the built
      # lib/renderer/index.js (the packaging guard), which doesn't exist on a
      # clean checkout until this step.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
